# Blue3 Drive — stack MVP (Docker Compose).
#
#   app        Nextcloud 34 + apps curados + tema Dark Blue3
#   db         MariaDB (regra do projeto: nunca SQLite)
#   collabora  servidor Collabora/CODE (Office) em container separado
#   whiteboard servidor websocket do quadro branco (serviço separado)
#
# Segredos/parâmetros vêm do .env (copie de .env.example). NÃO comite o .env real.
# Subir (a partir de BLUE3/DRIVE):
#   docker compose -f build/compose.yml --env-file build/.env up -d --build
#
# Ver docs/PLANO-DE-ACAO.md Fase 4/5.
name: blue3-drive

services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    command: --transaction-isolation=READ-COMMITTED --log-bin=binlog --binlog-format=ROW
    environment:
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?defina no .env}
      MARIADB_DATABASE: ${MYSQL_DATABASE:-blue3drive}
      MARIADB_USER: ${MYSQL_USER:-blue3}
      MARIADB_PASSWORD: ${MYSQL_PASSWORD:?defina no .env}
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12

  app:
    build:
      context: ..
      dockerfile: build/Dockerfile
    image: blue3-drive:34
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      # Conexão com o banco (devem casar com as credenciais do serviço db)
      MYSQL_HOST: db
      MYSQL_DATABASE: ${MYSQL_DATABASE:-blue3drive}
      MYSQL_USER: ${MYSQL_USER:-blue3}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?defina no .env}
      # Admin inicial + domínios confiáveis (auto-install no 1º boot)
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER:-admin}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD:?defina no .env}
      NEXTCLOUD_TRUSTED_DOMAINS: ${NEXTCLOUD_TRUSTED_DOMAINS:-localhost app}
      # Repassados ao provision.sh p/ o wiring do whiteboard
      WHITEBOARD_JWT_SECRET: ${WHITEBOARD_JWT_SECRET:?defina no .env}
      WHITEBOARD_PUBLIC_URL: ${WHITEBOARD_PUBLIC_URL:-http://localhost:3002}
    volumes:
      - nextcloud:/var/www/html
    extra_hosts:
      # host.docker.internal → host: o NC alcança o Collabora e responde a WOPISrc
      # no MESMO nome que o navegador usa (requisito do WOPI; ver docs §8).
      - "host.docker.internal:host-gateway"

  whiteboard:
    image: ghcr.io/nextcloud-releases/whiteboard:v1.5.9   # casa com o app whiteboard 1.5.9
    restart: unless-stopped
    ports:
      - "${WHITEBOARD_PORT:-3002}:3002"
    environment:
      # URL interna do NC na rede do compose (server-to-server)
      NEXTCLOUD_URL: ${WHITEBOARD_NEXTCLOUD_URL:-http://app}
      JWT_SECRET_KEY: ${WHITEBOARD_JWT_SECRET:?defina no .env}
      BACKUP_DIR: /tmp/backup

  collabora:
    image: collabora/code:latest          # CODE (Collabora Online) — servidor de Office. TODO: pinar após validar.
    restart: unless-stopped
    cap_add: [MKNOD, SYS_CHROOT, SYS_ADMIN]
    environment:
      # NC autorizado a usar este Collabora (WOPI) — mesmo host que o navegador usa
      aliasgroup1: ${COLLABORA_ALIASGROUP:-http://host.docker.internal:8081}
      # nome público do Collabora (roteamento WebSocket)
      server_name: ${COLLABORA_SERVER_NAME:-host.docker.internal:9980}
      # HTTP puro local (sem SSL próprio nem proxy SSL na frente)
      extra_params: --o:ssl.enable=false --o:ssl.termination=false
      DONT_GEN_SSL_CERT: "1"
    ports:
      - "${COLLABORA_PORT:-9980}:9980"
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  db:
  nextcloud:
